name: Update prices (hourly)

on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices from Yahoo Finance
        run: python3 scripts/update_prices.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "stock-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Hourly price refresh"
            git pull --rebase
            git push
          fi
